<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>Regatta</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view" aria-label="Sailing simulator view"></canvas>
    <div id="readout" class="hud readout" title="Click to hide"></div>
    <canvas id="mini" class="hud mini" title="Chart. Click to open, or press M"></canvas>
    <div id="chart" class="chart" hidden></div>
    <div id="clock" class="hud clock" title="Click to pause, drag sideways to change speed"></div>
    <div id="alarm" class="hud alarm" role="status" aria-live="polite"></div>
    <div id="tag" class="tag" aria-hidden="true"></div>
    <div id="fps" class="hud fps" hidden></div>
    <button id="boardlink" class="hud boardlink" type="button" data-open-board="roadmap" title="Roadmap, what's new and feedback (B)">Roadmap · Feedback</button>
    <button id="racebar" class="hud racebar" type="button" title="Fleet and racing (R)" hidden></button>
    <aside id="fleetpanel" class="fleetpanel" aria-label="Fleet and racing" hidden></aside>
    <button id="newsflash" class="hud newsflash" type="button" hidden></button>
    <div id="board" class="board" hidden></div>
    <section id="join" class="join" aria-label="Before you sail" hidden></section>
    <aside id="coach" class="coach" aria-live="polite" hidden></aside>
    <aside id="hint" class="hint" aria-live="polite" hidden></aside>
    <div id="hails" class="hails" aria-live="polite"></div>
    <div id="hail" class="hail" hidden><label for="hail-text">Hail</label><input id="hail-text" type="text" maxlength="160" autocomplete="off"></div>
    <div id="veil" class="veil"><div class="title">Regatta<small>San Francisco Bay</small></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
